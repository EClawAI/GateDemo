# Prometheus alert rules for GateDemo services
# Severity: critical = immediate action; warning = attention needed

groups:
  - name: GateDemoInfrastructure
    rules:
      - alert: HighCpuUsage
        expr: process_cpu_usage > 0.8 or (rate(process_cpu_seconds_total[5m]) > 0.8)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for 5 minutes on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.85 or (process_resident_memory_bytes / (1024*1024*1024)) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for 5 minutes on {{ $labels.instance }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been down for more than 1 minute"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m])) > 0.5 or histogram_quantile(0.99, rate(grpc_server_handling_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "P99 latency exceeds 500ms for 5 minutes on {{ $labels.instance }}"

      - alert: GrpcCircuitBreakerOpen
        expr: grpc_client_circuit_breaker_state == 1 or grpc_client_circuit_breaker_open == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "gRPC circuit breaker is open"
          description: "gRPC circuit breaker has been open for 1 minute on {{ $labels.instance }}"
