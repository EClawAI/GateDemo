server:
  port: 9086

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

spring:
  application:
    name: login-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:redistest}
      database: 0

login:
  security:
    api-key: ${LOGIN_API_KEY:}
  server:
    port: 9086
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:redistest}
    database: 0
  jwt:
    secret: ${JWT_SECRET:DefaultGateDemoSecretKeyForHMACSHA256Auth!}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  recommend-games:
    - gameId: 1001
      name: "推荐服1"
      priority: 1
    - gameId: 1002
      name: "推荐服2"
      priority: 2
