apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-service
  namespace: gatedemo
  labels:
    app: gate-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gate-service
  template:
    metadata:
      labels:
        app: gate-service
    spec:
      containers:
        - name: gate-service
          image: ghcr.io/OWNER/gate-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: tcp
            - containerPort: 8890
              name: health
          envFrom:
            - configMapRef:
                name: gatedemo-config
          env:
            - name: GATE_PORT
              value: "8888"
            - name: HEALTH_PORT
              value: "8890"
            - name: GATE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8890
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8890
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gate-service
  namespace: gatedemo
  labels:
    app: gate-service
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888
      name: tcp
    - port: 8890
      targetPort: 8890
      name: health
  selector:
    app: gate-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gate-service
  namespace: gatedemo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gate-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
