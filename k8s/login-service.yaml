apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-service
  namespace: gatedemo
  labels:
    app: login-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-service
  template:
    metadata:
      labels:
        app: login-service
    spec:
      containers:
        - name: login-service
          image: ghcr.io/OWNER/login-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9086
              name: http
          envFrom:
            - configMapRef:
                name: gatedemo-config
          env:
            - name: SERVER_PORT
              value: "9086"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9086
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9086
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: login-service
  namespace: gatedemo
  labels:
    app: login-service
spec:
  type: ClusterIP
  ports:
    - port: 9086
      targetPort: 9086
      name: http
  selector:
    app: login-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: login-service
  namespace: gatedemo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: login-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
