server:
  port: 8083

spring:
  application:
    name: gate-service

gate:
  id: ${GATE_ID:gate-01}
  host: ${GATE_HOST:0.0.0.0}
  port: ${GATE_PORT:8888}
  game:
    host: ${GAME_HOST:localhost}
    port: ${GAME_GRPC_PORT:9090}  # gRPC 端口
  player:
    heartbeat-interval: 60

logging:
  level:
    com.clawai.gatedemo: DEBUG
    org.springframework.web.socket: DEBUG