server:
  port: 8080

spring:
  application:
    name: gate-service

gate:
  id: ${GATE_ID:gate-01}
  host: ${GATE_HOST:0.0.0.0}
  port: ${GATE_PORT:8888}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    stream:
      consumer-group: ${GATE_ID:gate-01}-cluster
      block-ms: 5000
      count: 100
  player:
    heartbeat-interval: 60
    map-ttl: 300

logging:
  level:
    com.clawai.gatedemo: DEBUG
    org.springframework.web.socket: DEBUG