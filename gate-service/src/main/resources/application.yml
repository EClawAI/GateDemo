server:
  port: 9083

spring:
  application:
    name: gate-service

gate:
  id: ${GATE_ID:gate-01}
  host: ${GATE_HOST:0.0.0.0}
  port: ${GATE_PORT:8888}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redistest}
  discovery:
    enabled: true
    initial-load-timeout: 5000
    stale-threshold: 120000
  games:
    - id: 1001
      host: ${GAME_1001_HOST:localhost}
      port: ${GAME_1001_PORT:9090}
  player:
    heartbeat-interval: 60

offline-message:
  threshold: 200
  enabled: true

logging:
  level:
    com.clawai.gatedemo: DEBUG
    org.springframework.web.socket: DEBUG
