server:
  port: 9083

spring:
  application:
    name: gate-service

gate:
  id: ${GATE_ID:gate-01}
  host: ${GATE_HOST:0.0.0.0}
  port: ${GATE_PORT:8888}
  max-connections: ${GATE_MAX_CONNECTIONS:10000}
  shutdown:
    enabled: ${GATE_GRACEFUL_SHUTDOWN:true}
    drain-timeout-seconds: ${GATE_SHUTDOWN_DRAIN_TIMEOUT:30}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:redistest}
    # Sentinel mode: when master is set, use Sentinel instead of standalone
    # sentinel:
    #   master: ${REDIS_SENTINEL_MASTER:mymaster}
    #   nodes:
    #     - ${REDIS_SENTINEL_NODE1:sentinel1:26379}
    #     - ${REDIS_SENTINEL_NODE2:sentinel2:26379}
    #     - ${REDIS_SENTINEL_NODE3:sentinel3:26379}
  discovery:
    enabled: true
    initial-load-timeout: 5000
    stale-threshold: 120000
  grpc-pool:
    keep-alive-time: ${GRPC_KEEP_ALIVE_TIME:30}
    keep-alive-timeout: ${GRPC_KEEP_ALIVE_TIMEOUT:10}
    keep-alive-without-calls: true
    reconnect-delay: ${GRPC_RECONNECT_DELAY:5000}
    reconnect-max-delay: ${GRPC_RECONNECT_MAX_DELAY:60000}
    reconnect-multiplier: ${GRPC_RECONNECT_MULTIPLIER:2.0}
    heartbeat-interval: ${GRPC_HEARTBEAT_INTERVAL:30000}
    # icefire-gate 对齐：false=发现到 game 即建 gRPC；true=认证后按需建连
    lazy-connect: ${GATE_GRPC_LAZY_CONNECT:false}
    idle-close-seconds: ${GATE_GRPC_IDLE_CLOSE_SECONDS:300}
    idle-sweep-interval-seconds: ${GATE_GRPC_IDLE_SWEEP_SECONDS:30}
  player:
    heartbeat-interval: 60
  flow:
    detached-ttl-seconds: ${GATE_FLOW_DETACHED_TTL_SECONDS:60}
    max-ttl-seconds: ${GATE_FLOW_MAX_TTL_SECONDS:86400}
    renewal-interval-seconds: ${GATE_FLOW_RENEWAL_INTERVAL_SECONDS:15}
    detached-scan-interval-seconds: ${GATE_FLOW_DETACHED_SCAN_INTERVAL_SECONDS:5}
    redis-key-prefix: ${GATE_FLOW_REDIS_KEY_PREFIX:gate:flow:}
    # B1: downstream buffer + gwSeq replay
    buffer:
      enabled: ${GATE_FLOW_BUFFER_ENABLED:true}
      capacity-entries: ${GATE_FLOW_BUFFER_CAPACITY_ENTRIES:256}
      capacity-bytes: ${GATE_FLOW_BUFFER_CAPACITY_BYTES:4194304}
      overflow-policy: ${GATE_FLOW_BUFFER_OVERFLOW_POLICY:drop_oldest}
    features:
      advertise-gw-seq: ${GATE_FLOW_FEATURES_GW_SEQ:true}
      advertise-replay: ${GATE_FLOW_FEATURES_REPLAY:true}
    # B2: cross-instance owner takeover + Pub/Sub eviction
    cross:
      enabled: ${GATE_FLOW_CROSS_ENABLED:true}
      evict-channel: ${GATE_FLOW_CROSS_EVICT_CHANNEL:gate:flow:evict}
      publish-self-evict: ${GATE_FLOW_CROSS_PUBLISH_SELF:false}
    # B3: offline message merge policy
    offline:
      enabled: ${GATE_FLOW_OFFLINE_ENABLED:true}
      retention-days: ${GATE_FLOW_OFFLINE_RETENTION_DAYS:7}
      relogin-threshold: ${GATE_FLOW_OFFLINE_RELOGIN_THRESHOLD:200}
      replay-batch-size: ${GATE_FLOW_OFFLINE_REPLAY_BATCH:100}
      flush-on-destroy: ${GATE_FLOW_OFFLINE_FLUSH_ON_DESTROY:true}
      flush-on-cross-evict: ${GATE_FLOW_OFFLINE_FLUSH_ON_CROSS_EVICT:true}
    # Observability: 跨实例 takeover / RESUME 分桶指标 + cross logger
    observability:
      enabled: ${GATE_FLOW_OBSERVABILITY_ENABLED:true}
      takeover-total-enabled: ${GATE_FLOW_OBSERVABILITY_TAKEOVER_TOTAL_ENABLED:true}
      resume-total-enabled: ${GATE_FLOW_OBSERVABILITY_RESUME_TOTAL_ENABLED:true}
      replay-total-enabled: ${GATE_FLOW_OBSERVABILITY_REPLAY_TOTAL_ENABLED:true}
      latency-enabled: ${GATE_FLOW_OBSERVABILITY_LATENCY_ENABLED:true}
      cross-logger-enabled: ${GATE_FLOW_OBSERVABILITY_CROSS_LOGGER_ENABLED:true}
      histogram-slo: ${GATE_FLOW_OBSERVABILITY_HISTOGRAM_SLO:10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s}
      resume-timeout-ms: ${GATE_FLOW_OBSERVABILITY_RESUME_TIMEOUT_MS:3000}
  health:
    port: ${HEALTH_PORT:8890}
  jwt:
    secret: ${JWT_SECRET:DefaultGateDemoSecretKeyForHMACSHA256Auth!}
  tls:
    enabled: ${TLS_ENABLED:false}
    cert-path: ${TLS_CERT_PATH:}
    key-path: ${TLS_KEY_PATH:}

  security:
    encryption:
      enabled: ${GATE_ENCRYPTION_ENABLED:false}
      key: ${GATE_ENCRYPTION_KEY:}
  message:
    max-length: ${GATE_MESSAGE_MAX_LENGTH:65536}
    msg-type-max-length: 64
  ratelimit:
    per-player:
      max-requests: ${RATELIMIT_PER_PLAYER_MAX:60}
      window-ms: ${RATELIMIT_PER_PLAYER_WINDOW:60000}
    global:
      max-requests: ${RATELIMIT_GLOBAL_MAX:10000}
      window-ms: ${RATELIMIT_GLOBAL_WINDOW:1000}
  cluster:
    enabled: true
  circuitbreaker:
    failure-threshold: ${CB_FAILURE_THRESHOLD:5}
    reset-timeout-ms: ${CB_RESET_TIMEOUT:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true

offline-message:
  threshold: 200
  enabled: true

logging:
  level:
    com.clawai.gatedemo: DEBUG
    org.springframework.web.socket: DEBUG
