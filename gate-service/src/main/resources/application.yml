server:
  port: 9083

spring:
  application:
    name: gate-service

gate:
  id: ${GATE_ID:gate-01}
  host: ${GATE_HOST:0.0.0.0}
  port: ${GATE_PORT:8888}
  max-connections: ${GATE_MAX_CONNECTIONS:10000}
  shutdown:
    enabled: ${GATE_GRACEFUL_SHUTDOWN:true}
    drain-timeout-seconds: ${GATE_SHUTDOWN_DRAIN_TIMEOUT:30}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redistest}
    # Sentinel mode: when master is set, use Sentinel instead of standalone
    # sentinel:
    #   master: ${REDIS_SENTINEL_MASTER:mymaster}
    #   nodes:
    #     - ${REDIS_SENTINEL_NODE1:sentinel1:26379}
    #     - ${REDIS_SENTINEL_NODE2:sentinel2:26379}
    #     - ${REDIS_SENTINEL_NODE3:sentinel3:26379}
  discovery:
    enabled: true
    initial-load-timeout: 5000
    stale-threshold: 120000
  grpc-pool:
    keep-alive-time: ${GRPC_KEEP_ALIVE_TIME:30}
    keep-alive-timeout: ${GRPC_KEEP_ALIVE_TIMEOUT:10}
    keep-alive-without-calls: true
    reconnect-delay: ${GRPC_RECONNECT_DELAY:5000}
    reconnect-max-delay: ${GRPC_RECONNECT_MAX_DELAY:60000}
    reconnect-multiplier: ${GRPC_RECONNECT_MULTIPLIER:2.0}
    heartbeat-interval: ${GRPC_HEARTBEAT_INTERVAL:30000}
  player:
    heartbeat-interval: 60
  health:
    port: ${HEALTH_PORT:8890}
  jwt:
    secret: ${JWT_SECRET:DefaultGateDemoSecretKeyForHMACSHA256Auth!}
  tls:
    enabled: ${TLS_ENABLED:false}
    cert-path: ${TLS_CERT_PATH:}
    key-path: ${TLS_KEY_PATH:}

  security:
    encryption:
      enabled: ${GATE_ENCRYPTION_ENABLED:false}
      key: ${GATE_ENCRYPTION_KEY:}
  message:
    max-length: ${GATE_MESSAGE_MAX_LENGTH:65536}
    msg-type-max-length: 64
  ratelimit:
    per-player:
      max-requests: ${RATELIMIT_PER_PLAYER_MAX:60}
      window-ms: ${RATELIMIT_PER_PLAYER_WINDOW:60000}
    global:
      max-requests: ${RATELIMIT_GLOBAL_MAX:10000}
      window-ms: ${RATELIMIT_GLOBAL_WINDOW:1000}
  cluster:
    enabled: true
  circuitbreaker:
    failure-threshold: ${CB_FAILURE_THRESHOLD:5}
    reset-timeout-ms: ${CB_RESET_TIMEOUT:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true

offline-message:
  threshold: 200
  enabled: true

logging:
  level:
    com.clawai.gatedemo: DEBUG
    org.springframework.web.socket: DEBUG
