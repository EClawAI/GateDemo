version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - gatedemo
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  center-service:
    build:
      context: ./center-service
      dockerfile: Dockerfile
    ports:
      - "9085:9085"
    environment:
      - SERVER_PORT=9085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - gatedemo

  login-service:
    build:
      context: ./login-service
      dockerfile: Dockerfile
    ports:
      - "9086:9086"
    environment:
      - SERVER_PORT=9086
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=
      - LOGIN_REDIS_HOST=redis
      - LOGIN_REDIS_PORT=6379
      - LOGIN_REDIS_PASSWORD=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gatedemo

  game-1001:
    build:
      context: ./game-service
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      - GAME_ID=1001
      - GRPC_PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:9090"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gatedemo

  gate-01:
    build:
      context: ./gate-service
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
      - "8890:8890"
    environment:
      - GATE_ID=gate-01
      - GATE_PORT=8888
      - HEALTH_PORT=8890
      - GAME_1001_HOST=game-1001
      - GAME_1001_PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      game-1001:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatedemo

  gate-02:
    build:
      context: ./gate-service
      dockerfile: Dockerfile
    ports:
      - "8889:8888"
      - "8891:8890"
    environment:
      - GATE_ID=gate-02
      - GATE_PORT=8888
      - HEALTH_PORT=8890
      - GAME_1001_HOST=game-1001
      - GAME_1001_PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      game-1001:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatedemo

  player-client:
    build:
      context: ./player-client
      dockerfile: Dockerfile
    environment:
      - PLAYER_ID=100001
      - GATE_HOST=gate-01
      - GATE_PORT=8888
    depends_on:
      gate-01:
        condition: service_healthy
    networks:
      - gatedemo

networks:
  gatedemo:
    driver: bridge

volumes:
  redis-data:
