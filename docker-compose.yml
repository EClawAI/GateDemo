version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - gatedemo
    volumes:
      - redis-data:/data
    command: ["redis-server", "--requirepass", "redistest"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redistest", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongodb:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    networks:
      - gatedemo
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: MyWar185mongo
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--host",
          "localhost",
          "--port",
          "27017",
          "-u",
          "root",
          "-p",
          "MyWar185mongo",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  center-service:
    build:
      context: ./center-service
      dockerfile: Dockerfile
    ports:
      - "9085:9085"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=9085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - gatedemo

  login-service:
    build:
      context: ./login-service
      dockerfile: Dockerfile
    ports:
      - "9086:9086"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=9086
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redistest
      - JWT_SECRET=${JWT_SECRET:-DefaultGateDemoSecretKeyForHMACSHA256Auth!}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gatedemo

  game-1001:
    build:
      context: ./game-service
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - GAME_ID=1001
      - GRPC_PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redistest
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=gatedemo
      - MONGO_ROOT_USERNAME=root
      - MONGO_ROOT_PASSWORD=MyWar185mongo
      - MONGO_AUTH_SOURCE=admin
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:9090"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - gatedemo

  gate-01:
    build:
      context: ./gate-service
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
      - "8890:8890"
      - "9999:9999"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - GATE_ID=gate-01
      - GATE_PORT=8888
      - HEALTH_PORT=8890
      - GAME_1001_HOST=game-1001
      - GAME_1001_PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redistest
      - JWT_SECRET=${JWT_SECRET:-DefaultGateDemoSecretKeyForHMACSHA256Auth!}
      # S06 多 transport 场景：启用 TCP（与 WS 同时监听）
      - GATE_TCP_ENABLED=true
      - GATE_TCP_PORT=9999
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      game-1001:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatedemo

  gate-02:
    build:
      context: ./gate-service
      dockerfile: Dockerfile
    ports:
      - "8889:8888"
      - "8891:8890"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - GATE_ID=gate-02
      - GATE_PORT=8888
      - HEALTH_PORT=8890
      - GAME_1001_HOST=game-1001
      - GAME_1001_PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redistest
      - JWT_SECRET=${JWT_SECRET:-DefaultGateDemoSecretKeyForHMACSHA256Auth!}
      # gate-02 暂不映射 TCP（端口冲突），S06 仅校验 gate-01 上 WS+TCP 共存；
      # S04 跨实例只走 WS，不需要 gate-02 启 TCP。
      - GATE_TCP_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      game-1001:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatedemo

  player-client:
    build:
      context: ./player-client
      dockerfile: Dockerfile
    environment:
      - PLAYER_ID=100001
      - GATE_HOST=gate-01
      - GATE_PORT=8888
    depends_on:
      gate-01:
        condition: service_healthy
    networks:
      - gatedemo

networks:
  gatedemo:
    driver: bridge

volumes:
  redis-data:
  mongo-data:
