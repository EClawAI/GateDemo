version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - gatedemo
    volumes:
      - redis-data:/data

  gate-01:
    build:
      context: ./gate-service
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - GATE_ID=gate-01
      - GATE_PORT=8888
      - GAME_HOST=game-1001
      - GAME_PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      game-1001:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gatedemo

  gate-02:
    build:
      context: ./gate-service
      dockerfile: Dockerfile
    ports:
      - "8889:8888"
    environment:
      - GATE_ID=gate-02
      - GATE_PORT=8888
      - GAME_HOST=game-1001
      - GAME_PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      game-1001:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gatedemo

  game-1001:
    build:
      context: ./game-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - GAME_ID=game-1001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/game/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gatedemo

  player-client:
    build:
      context: ./player-client
      dockerfile: Dockerfile
    environment:
      - PLAYER_ID=100001
      - GATE_HOST=gate-01
      - GATE_PORT=8888
    depends_on:
      - gate-01
    networks:
      - gatedemo

networks:
  gatedemo:
    driver: bridge

volumes:
  redis-data:
