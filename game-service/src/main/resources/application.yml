spring:
  application:
    name: game-service
  data:
    mongodb:
      # 与常见本地 Compose（root + requirepass）一致；无认证环境请用 SPRING_DATA_MONGODB_URI 覆盖
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_ROOT_USERNAME:root}:${MONGO_ROOT_PASSWORD:MyWar185mongo}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:gatedemo}?authSource=${MONGO_AUTH_SOURCE:admin}}

# Game 服务配置
game:
  id: ${GAME_ID:1001}
  slg:
    gameplay-id: ${GAME_SLG_GAMEPLAY_ID:default}
    sandbox-persistence-region-id: ${GAME_SLG_SANDBOX_REGION_ID:0}
  persistence:
    flush-interval: ${FLUSH_INTERVAL:30000}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:redistest}
    database: 0
  status:
    heartbeat-interval: 30000

# gRPC 服务配置
grpc:
  port: ${GRPC_PORT:9090}
  tls:
    enabled: ${TLS_ENABLED:false}
    cert-path: ${TLS_CERT_PATH:}
    key-path: ${TLS_KEY_PATH:}

logging:
  level:
    com.clawai.gatedemo: DEBUG
