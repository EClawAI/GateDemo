# Pekko (HOCON). Merged with reference.conf from pekko-actor-typed.
# Spring Boot application.yml is separate; this file is loaded by ConfigFactory.load() for the ActorSystem.

pekko {
  actor {
    default-dispatcher {
      throughput = 5
    }

    # 与 SLG 无状态 Worker / 重计算任务配合：在代码中用 DispatcherSelector 绑定到本 dispatcher，
    # 避免与 Typed Actor 默认线程池争用（详见 game-slg-aggregate-actors-worldmap-worker design）。
    game-slg-worker-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 4
      }
      throughput = 5
    }

    # Application-side backpressure for Gate–Game stream ingress (see docs/backpressure-design.md).
    # HTTP/2 flow control is separate; when this queue is full, push-timeout 0 drops to dead letters (logged).
    mailbox {
      stream-ingress-bounded {
        mailbox-type = "org.apache.pekko.dispatch.BoundedMailbox"
        mailbox-capacity = 1000
        mailbox-push-timeout-time = 0s
      }
    }
  }
}
